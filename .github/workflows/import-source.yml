
name: Import Miruro source ZIP

on:
  push:
    paths:
      - 'MiruroCloudStream-source.zip'
      - '.github/workflows/import-source.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.WORKFLOW_TOKEN }}

      - name: Extract and install source files
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="MiruroCloudStream-source.zip"
          TEMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TEMP_DIR"' EXIT

          if [[ ! -f "$ARCHIVE" ]]; then
            echo "Source ZIP not found."
            exit 1
          fi

          unzip -t "$ARCHIVE"
          unzip -q "$ARCHIVE" -d "$TEMP_DIR"

          PROJECT_DIR="$TEMP_DIR/MiruroCloudStream"

          if [[ ! -d "$PROJECT_DIR" ]]; then
            echo "Project directory missing."
            exit 1
          fi

          cp -a "$PROJECT_DIR/." .

          rm "$ARCHIVE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to import."
            exit 0
          fi

          git commit -m "Import Miruro CloudStream source"
          git push
